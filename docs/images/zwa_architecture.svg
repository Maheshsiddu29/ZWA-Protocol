<text x="44" y="119" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57606a" font-weight="700" letter-spacing="0.5">01 / VERIFY ORIGIN</text>
<text x="44" y="154" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#24292f" font-weight="700">Private</text>
<text x="44" y="181" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#24292f" font-weight="700">provenance</text>
<text x="44" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">Prove that a supported asset</text>
<text x="44" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">note descends from an</text>
<text x="44" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">authorized origin.</text>
<text x="44" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57606a" font-weight="700" letter-spacing="0.5">02 / CHECK PRIVATE RULES</text>
<text x="44" y="440" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#24292f" font-weight="700">Private policy</text>
<text x="44" y="467" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#24292f" font-weight="700">layer</text>
<text x="44" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">Attach eligibility or policy</text>
<text x="44" y="517" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">signals without exposing raw</text>
<text x="44" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">user data.</text>
<text x="44" y="689" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#57606a" font-weight="700" letter-spacing="0.5">03 / SETTLE PRIVATELY</text>
<text x="44" y="724" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#24292f" font-weight="700">Experimental</text>
<text x="44" y="751" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#24292f" font-weight="700">checkout</text>
<text x="44" y="782" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">Coordinate buyer, seller and</text>
<text x="44" y="801" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">sponsor signers for a private</text>
<text x="44" y="820" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">exchange flow.</text>
