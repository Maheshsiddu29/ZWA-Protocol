<text x="684.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#24292f" font-weight="700">Eligibility / commitment</text>
<text x="684.0" y="490.5" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#24292f" font-weight="700">proof</text>
<text x="684.0" y="527.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">Produces a policy signal without</text>
<text x="684.0" y="545.5" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#57606a">exposing raw compliance data.</text>
