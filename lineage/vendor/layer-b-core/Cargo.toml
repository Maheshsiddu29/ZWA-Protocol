[package]
name = "zwa-layer-b-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "Byte-traceable production extraction of frozen ZWA Layer-B verification"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
blake2b_simd = "=1.0.1"
bridgetree = "0.7.0"
ff = "0.13"
hex = "0.4"
orchard = { version = "0.14.0", features = ["zsa-issuance", "circuit"] }
pasta_curves = "0.5"
serde_json = "1"
sha2 = "0.10"
zcash_encoding = "0.4"
zcash_primitives = { version = "0.28.0", features = ["circuits", "transparent-inputs", "non-standard-fees", "zsa-issuance", "zip-233"] }
zcash_protocol = "0.9.0"
zcash_transparent = { version = "0.8.0", features = ["transparent-inputs"] }
