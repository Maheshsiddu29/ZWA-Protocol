[package]
name = "zwa-lineage-r2b-l1-local"
version = "0.0.0"
edition = "2021"
publish = false

# R2B rebuilt on the L1 gadget stack. The lineage relation is frozen
# NormalLineageStepV2. Upstream gadgets are compiled in place from the L1
# Orchard checkout via #[path]. Nothing under r2a/r2b/r2c-h1* is edited.

[lib]
test = false
doctest = false

[features]
default = ["circuit"]
circuit = []
std = []
unstable-voting-circuits = []

[dependencies]
orchard = { version = "0.14.0", features = ["zsa-issuance"] }
halo2_gadgets = "0.5"
halo2_proofs = { version = "0.3", default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
pasta_curves = "0.5"
group = "0.13"
ff = "0.13"
rand = "0.8"
zcash_spec = "0.2"
hex = "0.4.3"
sha2 = "0.10"
serde_json = "1"
subtle = "2.3"
sinsemilla = "0.1"
zcash_primitives = { version = "0.28.0", features = ["zsa-issuance", "zip-233"] }
zcash_protocol = "0.9.0"
