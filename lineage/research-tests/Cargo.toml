[package]
name = "zwa-lineage-research-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
zwa-lineage = { path = ".." }
zwa-layer-b-core = { path = "../vendor/layer-b-core" }
zwa-lineage-r2b-l1 = { path = "../../../ZWA-Lineage-Research/r2c-h1d/r2b-l1" }
orchard = { version = "0.14.0", features = ["zsa-issuance", "circuit"] }
halo2_proofs = { version = "0.3", default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
pasta_curves = "0.5"
ff = "0.13"
sha2 = "0.10"
hex = "0.4.3"
serde_json = "1"
zcash_primitives = { version = "0.28.0", features = ["circuits", "transparent-inputs", "non-standard-fees", "zsa-issuance", "zip-233"] }
incrementalmerkletree = "0.8.2"

# Differential oracles only. Never linked into the library.
zwa-r3e-experiments = { path = "../../../ZWA-Lineage-Research/post-h1f/r3e/experiments" }
zwa-layer-b = { path = "../../../ZWA-Lineage-Research/post-h1f/layer-b/experiments" }

[patch.crates-io]
orchard = { git = "https://github.com/QED-it/orchard", rev = "cf801a5d6701bc128e21678ba0034564af4a2aca" }
sapling-crypto = { git = "https://github.com/QED-it/sapling-crypto", rev = "e785faaa5eaf67bd2cb328fdd82a345df44e5754" }
