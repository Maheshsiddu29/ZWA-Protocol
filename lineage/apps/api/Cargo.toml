[package]
name = "zwa-lineage-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
zwa-lineage = { path = "../.." }
zwa-layer-b-core = { path = "../../vendor/layer-b-core" }
sha2 = "0.10"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
